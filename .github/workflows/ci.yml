name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          # the release itself, not the distribution's 0.9.0: tests/unit.sh switches the
          # data-flow pass off for its own length, a directive that 0.10 brought
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Syntax check (bash -n)
        run: |
          for f in setup.sh lib/*.sh tests/*.sh; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done
          echo "all files parse"

      - name: ShellCheck (errors must be zero)
        run: shellcheck -S error -x setup.sh lib/*.sh tests/*.sh

      - name: ShellCheck (warnings, informational)
        continue-on-error: true
        run: shellcheck -S warning -x setup.sh lib/*.sh

  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          jq --version
          bash --version | head -1

      - name: Run unit tests (gawk)
        run: bash tests/unit.sh

      - name: Run unit tests (mawk)
        run: |
          sudo apt-get install -y -qq mawk
          mkdir -p "$RUNNER_TEMP/mawk"
          printf '#!/bin/sh\nexec /usr/bin/mawk "$@"\n' > "$RUNNER_TEMP/mawk/awk"
          chmod +x "$RUNNER_TEMP/mawk/awk"
          PATH="$RUNNER_TEMP/mawk:$PATH" awk -W version 2>&1 | head -1
          PATH="$RUNNER_TEMP/mawk:$PATH" bash tests/unit.sh

  dryrun:
    name: install --dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Dry run must change nothing and exit 0
        # "shell: bash" is what enables pipefail; the default "bash -e {0}" does not set
        # it, so the status of "setup.sh ... | tee" was tee's and therefore always 0 -
        # this job could not fail no matter how badly the dry run died.
        # stderr is redirected into the log because every diagnostic (lib_error, lib_die,
        # the ERR trap) writes there, which made the "[fail]" grep below a tautology.
        shell: bash
        run: |
          sudo bash setup.sh install --dry-run --non-interactive --no-color \
            --admin-ip 203.0.113.5 --email ci@example.com \
            --backup-schedule "daily 03:00" --cloudflare \
            --with-mail --mail-hostname mail.example.com 2>&1 | tee dryrun.out
          test ! -e /root/.server-setup || { echo "dry-run created state dir"; exit 1; }
          test ! -e /usr/local/lsws     || { echo "dry-run installed OLS"; exit 1; }
          test ! -e /etc/cron.d/server-setup || { echo "dry-run wrote cron"; exit 1; }
          # the mail stack is the newest thing a dry run can touch: it must plan it and
          # still leave the machine alone
          grep -q "Installing the mail stack for mail.example.com" dryrun.out \
            || { echo "dry-run did not plan the mail stack"; exit 1; }
          test ! -e /etc/postfix/lomp   || { echo "dry-run wrote Postfix maps"; exit 1; }
          test ! -e /etc/apt/sources.list.d/lomp-rspamd.list || { echo "dry-run added the Rspamd repository"; exit 1; }
          # "the last step ran" without hardcoding how many there are: find a [N/N] marker.
          # The old "grep 20/20" silently kept passing when a step was added and the
          # counter went to 21, because [20/21] still contained no 20/20 - it only failed
          # once the totals moved, which is exactly when a human stops trusting it.
          awk 'match($0, /\[[0-9]+\/[0-9]+\]/) {
                 s = substr($0, RSTART + 1, RLENGTH - 2); split(s, a, "/")
                 if (a[1] == a[2]) found = 1
               } END { exit !found }' dryrun.out \
            || { echo "dry-run did not reach the last step"; exit 1; }
          ! grep -qE '\[fail\]|unbound variable|FAILED:|Probable cause' dryrun.out

      - name: Dry run of a mail-only server
        # The role is not in any manifest yet - a dry run writes none - so everything that
        # depends on it has to take it from the run itself: the profile, the mail stack's own
        # notes and the summary at the end.
        shell: bash
        run: |
          sudo bash setup.sh install --dry-run --non-interactive --no-color \
            --mail-only --mail-hostname mail.example.com --email ci@example.com 2>&1 | tee dryrun-mail.out
          test ! -e /root/.server-setup || { echo "dry-run created state dir"; exit 1; }
          test ! -e /etc/postfix/lomp   || { echo "dry-run wrote Postfix maps"; exit 1; }
          grep -q "Mail-only server" dryrun-mail.out \
            || { echo "the role was not announced"; exit 1; }
          grep -q "Installing the mail stack for mail.example.com" dryrun-mail.out \
            || { echo "--mail-only did not plan the mail stack"; exit 1; }
          grep -q "(5% of RAM)" dryrun-mail.out \
            || { echo "the profile is not a mail server's"; exit 1; }
          grep -q "lomp mail domain add example.com --mailbox info" dryrun-mail.out \
            || { echo "the summary is not a mail server's"; exit 1; }
          awk 'match($0, /\[[0-9]+\/[0-9]+\]/) {
                 s = substr($0, RSTART + 1, RLENGTH - 2); split(s, a, "/")
                 if (a[1] == a[2]) found = 1
               } END { exit !found }' dryrun-mail.out \
            || { echo "dry-run did not reach the last step"; exit 1; }
          ! grep -qE '\[fail\]|unbound variable|FAILED:|Probable cause' dryrun-mail.out
          # a mail server with no name to send as is refused before the first step, not at step 17
          if sudo bash setup.sh install --dry-run --non-interactive --no-color \
               --mail-only --mail-hostname localhost >dryrun-noname.out 2>&1; then
            echo "a mail-only install with no usable name was not refused"; exit 1
          fi
          grep -q "no name to send mail as" dryrun-noname.out \
            || { echo "the refusal does not say why"; cat dryrun-noname.out; exit 1; }
          ! grep -qE '\[[0-9]+/[0-9]+\]' dryrun-noname.out \
            || { echo "a step ran before the refusal"; exit 1; }
